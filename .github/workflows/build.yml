name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'crowdin.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/review.yml*'
  pull_request:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
      - 'crowdin.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/review.yml*'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Restore
      run: dotnet restore
    - name: Restore identity package signing key
      env:
        LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
      run: |
        if ($env:LLT_CERT_PFX) {
          [IO.File]::WriteAllBytes("LenovoLegionToolkit.pfx", [Convert]::FromBase64String($env:LLT_CERT_PFX))
        } else {
          Write-Warning "No LLT_CERT_PFX secret found. Building in raw mode without Authenticode signing."
        }
      shell: powershell
    - name: Build
      env:
        LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
      run: |
        if (Test-Path "LenovoLegionToolkit.pfx") {
          .\make_action.bat
        } else {
          .\make_action.bat raw
        }
      shell: powershell
    - name: Verify installer
      run: |
        $installerPath = "build_installer\LenovoLegionToolkitSetup.exe"
        if (-not (Test-Path $installerPath)) {
          Write-Error "Installer file not found at $installerPath"
          exit 1
        }
      shell: powershell
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: build_installer\LenovoLegionToolkitSetup.exe
